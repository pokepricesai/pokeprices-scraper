name: Historical Backfill (Japanese)

# Block 5A-W-49 — one-time Japanese historical price backfill.
#
# Fetches every card's PriceCharting page ONCE and writes every
# available historical observation (raw, PSA 9, PSA 10, PSA 7/8/CGC 9.5
# where present) to daily_prices. Idempotent — rerun-safe.
#
# workflow_dispatch only. There is no cron schedule. Uses the SAME 5
# balanced Japanese batch files as nightly-scrape so we don't
# duplicate the catalogue configuration.
#
# Every job passes `--history --cadence all`:
#   * --history          → also parse VGPC.chart_data into daily_prices
#   * --cadence all      → include every card, not just the daily cohort
#
# Uses the shared `pokeprices-scrape` concurrency group so this
# workflow cannot overlap the daily nightly scrape or the weekly
# low-value scrape. `cancel-in-progress: false` queues rather than
# interrupts an active scrape.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would be scraped without hitting PriceCharting"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: pokeprices-scrape
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

jobs:
  batch-japanese-1:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Backfill Japanese batch 1 (history + cadence=all)
        run: python pokeprices_scraper_v8.py --sets-file batches/batch-japanese-1.txt --history --cadence all

  batch-japanese-2:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Backfill Japanese batch 2 (history + cadence=all)
        run: python pokeprices_scraper_v8.py --sets-file batches/batch-japanese-2.txt --history --cadence all

  batch-japanese-3:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Backfill Japanese batch 3 (history + cadence=all)
        run: python pokeprices_scraper_v8.py --sets-file batches/batch-japanese-3.txt --history --cadence all

  batch-japanese-4:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Backfill Japanese batch 4 (history + cadence=all)
        run: python pokeprices_scraper_v8.py --sets-file batches/batch-japanese-4.txt --history --cadence all

  batch-japanese-5:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Backfill Japanese batch 5 (history + cadence=all)
        run: python pokeprices_scraper_v8.py --sets-file batches/batch-japanese-5.txt --history --cadence all

  # Refresh trends AFTER every backfill batch succeeds. Fails hard if
  # any batch failed so we don't publish partial historical analytics.
  refresh-and-analytics:
    runs-on: ubuntu-latest
    needs: [batch-japanese-1, batch-japanese-2, batch-japanese-3, batch-japanese-4, batch-japanese-5]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Refresh card_trends
        run: python refresh_card_trends.py
      - name: Refresh Pokémon species stats
        continue-on-error: true
        run: python refresh_pokemon_species.py
