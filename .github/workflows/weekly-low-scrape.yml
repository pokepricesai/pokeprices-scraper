name: Weekly Low-Value Scrape

# Block 5A-W-49 — weekly cadence for cards whose latest raw price is
# in the WEEKLY_LOW / WEEKLY_UNPRICED cohort (raw > $0 and < $2.00, or
# three successful page-loads with no price extracted). Uses the same
# English and Japanese batch files as the daily nightly-scrape, but
# passes --cadence weekly so each job filters the CSV list down to the
# weekly cohort before hitting PriceCharting.
#
# Schedule: Sunday 06:00 UTC — two hours before the daily 08:00 cron
# so the shared `pokeprices-scrape` concurrency group queues rather
# than overlaps. `cancel-in-progress: false` protects an active
# multi-hour scrape.
#
# workflow_dispatch is supported for manual reruns; the cadence input
# defaults to `weekly` here so the ad-hoc "just refresh the low-value
# tail" story is one click away.
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      cadence:
        description: "Cadence override (weekly / all)"
        required: false
        default: "weekly"
        type: choice
        options: [weekly, all]

concurrency:
  group: pokeprices-scrape
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  CADENCE: ${{ github.event.inputs.cadence || 'weekly' }}

jobs:
  # —— 6 English batches ————————————————————————————————————————————
  batch1:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python pokeprices_scraper_v8.py --sets-file batches/batch1.txt --cadence $CADENCE

  batch2:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python pokeprices_scraper_v8.py --sets-file batches/batch2.txt --cadence $CADENCE

  batch3:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python pokeprices_scraper_v8.py --sets-file batches/batch3.txt --cadence $CADENCE

  batch4:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python pokeprices_scraper_v8.py --sets-file batches/batch4.txt --cadence $CADENCE

  batch5:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python pokeprices_scraper_v8.py --sets-file batches/batch5.txt --cadence $CADENCE

  batch6:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python pokeprices_scraper_v8.py --sets-file batches/batch6.txt --cadence $CADENCE

  # —— 5 Japanese batches ——————————————————————————————————————————
  batch-japanese-1:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python pokeprices_scraper_v8.py --sets-file batches/batch-japanese-1.txt --cadence $CADENCE

  batch-japanese-2:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python pokeprices_scraper_v8.py --sets-file batches/batch-japanese-2.txt --cadence $CADENCE

  batch-japanese-3:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python pokeprices_scraper_v8.py --sets-file batches/batch-japanese-3.txt --cadence $CADENCE

  batch-japanese-4:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python pokeprices_scraper_v8.py --sets-file batches/batch-japanese-4.txt --cadence $CADENCE

  batch-japanese-5:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python pokeprices_scraper_v8.py --sets-file batches/batch-japanese-5.txt --cadence $CADENCE

  # —— Refresh trends + analytics after all weekly batches succeed —————
  # Same shape as nightly-scrape refresh-and-analytics: fails hard if
  # any batch failed, so we never publish partial analytics.
  refresh-and-analytics:
    runs-on: ubuntu-latest
    needs: [batch1, batch2, batch3, batch4, batch5, batch6,
            batch-japanese-1, batch-japanese-2, batch-japanese-3,
            batch-japanese-4, batch-japanese-5]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Refresh card_trends
        run: python refresh_card_trends.py
      - name: Refresh Pokémon species stats
        continue-on-error: true
        run: python refresh_pokemon_species.py
